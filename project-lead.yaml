Name: Lisa001 (Chidi Olisa)
Role: Lead, Zcash Nigeria 2026 Program
Background: As Lead of Zcash Nigeria, the role for the 2026 program focuses on providing overall direction, coordination, and execution of all activities designed to expand Zcash’s presence, strengthen community engagement, and drive real-world adoption across the country.
Responsibilities:
- Program Leadership & Coordination: Supervising, organizing, and coordinating all Zcash Nigeria activities throughout the year.
- Public Relations & Communications: Acting as the primary public-facing representative of Zcash Nigeria.
- Partnership Development: Leading engagement with universities, tech hubs, blockchain communities, businesses, and organizations.
- Community Growth, Education & Outreach: Driving expansion of the Zcash Nigeria community across platforms.
- Real-World Adoption Efforts: Leading initiatives that onboard merchants and service providers in Nigeria to accept ZEC for payments.
- Governance & Ecosystem Contribution: Representing the Nigerian community within the broader Zcash ecosystem.